# Wild OS launchers (plain app names, see /usr/libexec/wildos/wildos-app-names)
# are read before the stock ones. Named to sort after Kicksecure's
# 99-environment.conf, which sets the whole list, so this prepends to it.
XDG_DATA_DIRS=/usr/share/wildos:${XDG_DATA_DIRS:-/usr/local/share:/usr/share}
# Programs a person installs for themselves (pip, cargo, an installer script)
# land in ~/.local/bin. Kicksecure's file sets the whole PATH without it, so
# such a program was "command not found" in the terminal.
PATH=${HOME}/.local/bin:${PATH}
# Games keep compiled shaders on disk so they don't stutter compiling them
# again. Mesa caps that cache at 1 GB, and once a few big games share it,
# each one's shaders get thrown out and the stutter comes back. 4 GB is only
# used as games fill it. NVIDIA's driver takes its size in bytes.
MESA_SHADER_CACHE_MAX_SIZE=4G
__GL_SHADER_DISK_CACHE_SIZE=4294967296
# KWin shows its on-screen keyboard only after a touch or a pen, so switched
# on in Settings > Accessibility it never came up for someone using a mouse,
# a switch or a keyboard. With this it comes up for any text box, as long as
# it is switched on.
KWIN_IM_SHOW_ALWAYS=1
