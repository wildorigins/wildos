# fprintd normally exits after 30 seconds unused. Kept running, the Goodix
# 533c driver keeps the last empty-sensor reference between uses, so a finger
# already on the reader when a prompt opens is read at once instead of
# needing to lift and touch again (build/patches/libfprint). The reader
# itself is still closed and asleep between uses; the daemon costs about
# 1.5 MB of memory.
[Service]
ExecStart=
ExecStart=/usr/libexec/fprintd --no-timeout
