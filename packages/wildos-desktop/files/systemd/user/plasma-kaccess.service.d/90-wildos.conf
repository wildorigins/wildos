# kaccess runs all session for the accessibility shortcuts and its few
# confirmation boxes, plain widget windows. This Qt sets OpenGL up at
# start-up for every client all the same (kaccess talks X11 and Wayland),
# which held 40 MB in a virtual machine and about 15 on a laptop. Orca, which
# kaccess may start, is not a Qt program and is not affected.
[Service]
Environment=QT_XCB_GL_INTEGRATION=none QT_WAYLAND_CLIENT_BUFFER_INTEGRATION=shm
