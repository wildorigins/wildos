# systemd stops starting file systems for a second whenever more than five
# mount changes arrive within one second. Wild OS mounts a dozen Btrfs
# subvolumes together at start-up, so it hit that limit twice and waited
# over a second for nothing. systemd reads this limit from its own
# environment, which this sets as it starts after the disk is unlocked.
[Manager]
ManagerEnvironment=SYSTEMD_DEFAULT_MOUNT_RATE_LIMIT_BURST=30
