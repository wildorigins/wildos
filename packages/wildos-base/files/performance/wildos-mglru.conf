# When memory runs out, the kernel never evicts pages used in the last
# second. Without this it can keep throwing out and reloading the app in
# use, which freezes the whole computer until systemd-oomd steps in after
# 20 seconds; with it, the kernel closes the largest app at once instead.
# 1000 ms is the value the kernel documentation suggests for removing lags
# a person would notice (Documentation/admin-guide/mm/multigen_lru.rst).
w- /sys/kernel/mm/lru_gen/min_ttl_ms - - - - 1000
