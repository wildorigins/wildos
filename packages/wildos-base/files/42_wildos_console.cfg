# Sorts after Kicksecure's 41_quiet_boot.cfg, which ends the command line
# with "loglevel=0 quiet". The kernel applies them in order, and quiet sets
# the screen back to showing errors, so firmware complaints ("[Firmware
# Bug] ...") printed over the start-up screen on some laptops. Only an
# emergency reaches the screen now; every message is still in the journal.
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT loglevel=1"
