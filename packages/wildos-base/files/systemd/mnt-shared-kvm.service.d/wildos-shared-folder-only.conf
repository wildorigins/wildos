# Only in a virtual machine that has a shared folder (a virtio 9p or
# virtiofs device). Everything else waited about 0.4 s for the mount to
# fail before start-up could go on. The devices are on the PCI bus from
# the moment the kernel starts, so this never misses one.
[Service]
ExecCondition=/bin/sh -c 'for d in /sys/bus/pci/devices/*; do [ "$$(cat "$$d/vendor")" = 0x1af4 ] || continue; case "$$(cat "$$d/device")" in 0x1009|0x1049|0x105a) exit 0 ;; esac; done; exit 1'
