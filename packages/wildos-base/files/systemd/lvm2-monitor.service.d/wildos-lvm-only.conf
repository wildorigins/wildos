# Only when LVM volumes are already active, which on Wild OS means the
# system itself sits on LVM (made by hand in the installer's manual
# partitioning). Wild OS's own layouts use no LVM, and asking LVM to scan
# every disk held the mounting of every file system up by half a second.
# Volumes activated later by udev are monitored as they are activated, so
# nothing is lost when this is skipped.
[Service]
ExecCondition=/bin/sh -c 'grep -qs "^LVM-" /sys/block/dm-*/dm/uuid'
