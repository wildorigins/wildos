# Gets a plugged-in printer's driver from the internet before CUPS's
# udev-configure-printer looks for one (printer-driver). Downloading and
# installing can take minutes on a slow connection. The ready notice comes
# once udev-configure-printer has finished, whether or not it managed.
[Service]
TimeoutStartSec=20min
ExecStartPre=-/usr/libexec/wildos/printer-driver plugged %i
ExecStopPost=-/usr/libexec/wildos/printer-driver ready %i
