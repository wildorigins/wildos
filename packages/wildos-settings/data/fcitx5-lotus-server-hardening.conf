# Lotus's server types the backspaces that correct a word (through
# /dev/uinput) and watches for clicks (libinput, group input), for one
# person's Fcitx, which it recognises by reading /proc/<pid>/exe of whoever
# connects to its sockets (CAP_SYS_PTRACE). Being in group input it could
# read every keyboard on the PC, so it gets nothing it doesn't use: no files
# to write, no network, no other devices, no way to gain privileges.
#
# Not used, because they break it: PrivateNetwork (its sockets are abstract
# ones, which live in the network namespace Fcitx must share), PrivateUsers
# (CAP_SYS_PTRACE must count outside the service to read another user's
# /proc entry), PrivateDevices and ProtectProc=invisible.
[Service]
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateIPC=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
DevicePolicy=closed
DeviceAllow=/dev/uinput rw
DeviceAllow=char-input rw
RestrictAddressFamilies=AF_UNIX AF_NETLINK
IPAddressDeny=any
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
RemoveIPC=yes
UMask=0077
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@privileged
SystemCallErrorNumber=EPERM
