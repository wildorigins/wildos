<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- wildos-network (root). Anyone may tell it that they switched a VPN
     off on purpose (Release), which they could equally do through
     NetworkManager, ask which programs wait for connections (Listening,
     what ss shows root) and empty the firewall's list of what it blocked
     (ClearBlocked). Nothing else is offered. -->
<busconfig>
  <policy user="root">
    <allow own="org.wildos.Network"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.wildos.Network" send_interface="org.wildos.Network" send_member="Release"/>
    <allow send_destination="org.wildos.Network" send_interface="org.wildos.Network" send_member="Listening"/>
    <allow send_destination="org.wildos.Network" send_interface="org.wildos.Network" send_member="ClearBlocked"/>
    <allow send_destination="org.wildos.Network" send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
