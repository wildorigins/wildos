# Wild OS draws its own Open and Save dialog (wildos-portal); everything
# else comes from the KDE portal. KDE's file dialog stays as the fallback
# should the Wild OS one fail to start.
#
# Settings and Secret as in KDE's own file, which this one replaces. The GTK
# portal adds the GNOME settings the KDE one doesn't serve, among them the
# title bar buttons: without them a Flatpak GTK app such as Firefox shows
# only a close button. KWallet keeps passwords for Flatpak apps.
[preferred]
default=kde
org.freedesktop.impl.portal.FileChooser=wildos;kde
org.freedesktop.impl.portal.Settings=kde;gtk
org.freedesktop.impl.portal.Secret=kwallet
