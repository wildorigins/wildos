---
efiBootLoader: "grub"
efiBootloaderId: "wildos"
kernelSearchPath: "/boot"
kernelPattern: "^vmlinuz.*"
timeout: "5"
# Retries without a firmware boot entry when the firmware refuses one
# (written into the target by install-bootloader-packages).
grubInstall: "/usr/libexec/wildos-installer/grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
# Calamares' fallback copies plain GRUB, which Secure Boot rejects. The
# finalize-target helper installs shim to the fallback path instead.
installEFIFallback: false
