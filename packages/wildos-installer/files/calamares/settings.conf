---
# Wild OS's own job modules (wildosrecovery) live with the package.
modules-search: [ local, /usr/lib/calamares/modules, /usr/share/wildos-installer/modules ]

instances:
  - id: licence
    module: notesqml
    config: notesqml-licence.conf
  - id: bootloader-packages
    module: shellprocess
    config: shellprocess-bootloader-packages.conf
  - id: finalize
    module: shellprocess
    config: shellprocess-finalize.conf
    weight: 3
  - id: encryption
    module: notesqml
    config: notesqml-encryption.conf
  - id: nocow
    module: shellprocess
    config: shellprocess-nocow.conf
  - id: resetcopy
    module: shellprocess
    config: shellprocess-resetcopy.conf
  # Weights give each module its share of the progress bar. They follow
  # the time each takes in a test install, so no step holds the bar still
  # for long: making the encrypted partition (Argon2id takes time and
  # memory on purpose) and preparing the system to start took far longer than their
  # default share of one. wildosrecovery sets its own in module.desc.
  - id: partition
    module: partition
    config: partition.conf
    weight: 3

# The sidebar shows six steps, and calamares-sidebar.qml,
# calamares-navigation.qml and summaryq.qml count on this order:
#   Licence           notesqml@licence (no warranty, the box to tick)
#   Before we start   welcomeq (checks), localeq (no page: the time zone and
#                     language follow the boot language)
#   Keyboard          keyboardq
#   Where to install  partition (choices, or the disk editor)
#   Encryption        notesqml@encryption (disk password, recovery key)
#   Install           summaryq, the install itself, finishedq
# There is no account, Wi-Fi or region step: the first start of the
# installed system asks for those, so no users
# module runs here. A module that collects answers must appear under the
# same name in exec.
#
# No displaymanager job: SDDM is configured by packages (wildos-desktop,
# wildos-setup). The module writes /etc/sddm.conf, which SDDM reads after
# sddm.conf.d, so its [Autologin] Session=wildos overrode first-boot setup's
# and the setup account was started into the desktop.
sequence:
  - show:
      - notesqml@licence
      - welcomeq
      - localeq
      - keyboardq
      - partition
      - notesqml@encryption
      - summaryq
  - exec:
      # First, so nothing touches the disk unless the licence was accepted.
      - wildoslicence
      - partition
      # Right after the partitions are made, so a recovery key that cannot
      # be added stops the install before anything is copied.
      - wildosrecovery
      - mount
      - shellprocess@nocow
      - unpackfs
      - shellprocess@resetcopy
      - machineid
      - removeuser
      - fstab
      - localeq
      - keyboardq
      - localecfg
      - networkcfg
      - hwclock
      # Before the boot loader, so the install page's stages run in order
      # (show.qml): settings, then the start-up menu.
      - packages
      - shellprocess@bootloader-packages
      - bootloader
      - shellprocess@finalize
      # The install's own log, for working out later why a step was slow
      # or failed.
      - preservefiles
      - umount
  - show:
      - finishedq

branding: wildos
# The Ready to install page is the confirmation; no second question.
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
# Closing mid-install would leave the disk half-written, so the installer
# refuses to close until it has finished.
disable-cancel-during-exec: true
quit-at-end: false
