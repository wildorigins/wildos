# Devices inside the computer (Bluetooth, fingerprint reader, webcam, card
# reader) sit on USB ports the firmware marks as not reachable from outside:
# "hardwired", or "not used" for a port with no socket. Some of them reset
# themselves after start-up and come back looking newly plugged in, which held
# Bluetooth back until it was allowed by hand. Ports with a socket report
# "hotplug" and still follow Block new USB devices. After Kicksecure's
# 30_security-misc.conf, so its refusals of risky interfaces still come first.
allow with-connect-type "hardwired"
allow with-connect-type "not used"
