# Devices inside the computer (Bluetooth, fingerprint reader, webcam, card
# reader) sit on USB ports the firmware marks as not reachable from outside:
# "hardwired", or "not used" for a port with no socket. Some of them reset
# themselves after start-up and come back looking newly plugged in, which held
# Bluetooth back until it was allowed by hand. Ports with a socket report
# "hotplug" and still follow Block new USB devices. After Kicksecure's
# 30_security-misc.conf, so its refusals of risky interfaces still come first.
allow with-connect-type "hardwired"
allow with-connect-type "not used"

# A PC is never left without a keyboard or a mouse. Kicksecure's rules above
# let in a device that is only a keyboard or only a mouse. A wireless
# receiver is usually both at once, and many keyboards carry a second
# interface for media keys, so neither rule matched them. They worked only
# when USBGuard found them already connected as it started. One that
# connected a moment later, or dropped off and came back, was held back, and
# on a desktop PC there was then nothing to allow it with: no keyboard and no
# mouse at the sign-in screen. The first device with a keyboard on it, and
# the first with a mouse on it, now work at once whatever else is on them; a
# second one still waits to be allowed. Kicksecure has already refused any
# device that mixes these with something that is not a keyboard, mouse or
# other input device, so this is reached only by input devices.
allow with-interface one-of { 03:01:01 } if !allowed-matches(with-interface one-of { 03:01:01 })
allow with-interface one-of { 03:01:02 } if !allowed-matches(with-interface one-of { 03:01:02 })
