# The look of the start-up menu: the Wild OS GRUB theme, drawn when the
# package is built (tools/grub-theme.sh). Sorts after Kicksecure's
# 30_kicksecure.cfg, whose theme and screen modes these replace.
GRUB_THEME="/boot/grub/themes/wildos/theme.txt"

# The modes the USB stick's menu asks for (build/iso/grub.cfg). Most screens
# of the last decade offer one of these; the firmware's own preference
# ("auto") is often 4K, where a 1440x900 design is tiny.
GRUB_GFXMODE="1920x1080,1920x1200,1600x900,1440x900,1366x768,1280x800,1280x720,1024x768,auto"

# Nothing between the maker's logo and the Wild OS screen, as on a Mac. GRUB
# stays on the firmware's console, so it changes no screen mode at a normal
# start; 06_wildos_menu_look draws the themed menu only when it will be
# seen. Linux keeps the firmware's screen mode instead of the 1024x768 that
# Kicksecure's 30_screen_resolution.cfg asks for, and systemd's status lines
# ("A stop job is running...") stay off the screen, in the start-up image
# too. They still go to the log.
GRUB_TERMINAL_OUTPUT=console
GRUB_GFXPAYLOAD_LINUX=keep
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT systemd.show_status=false rd.systemd.show_status=false"
