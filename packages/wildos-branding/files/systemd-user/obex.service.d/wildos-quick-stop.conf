# Bluetooth file transfer (obexd) hung for 15 seconds at every sign-out and
# shutdown: the session's D-Bus had already stopped and obexd waited on it.
# Stopping it while D-Bus is still there lets it end at once; the timeout
# keeps a stuck one from holding the shutdown back.
[Unit]
After=dbus.service

[Service]
TimeoutStopSec=3
